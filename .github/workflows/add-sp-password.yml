name: Add service principal password

on:
  workflow_dispatch:
    inputs:
      service_principal_id:
        description: Service principal object ID
        required: true
        type: string
      display_name:
        description: Display name for the new password credential
        required: true
        default: GitHub Actions credential
        type: string
      valid_days:
        description: Number of days before the password expires
        required: true
        default: "90"
        type: string
permissions:
  contents: read

jobs:
  add-password:
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      AZURE_SERVICE_PRINCIPAL_ID: ${{ inputs.service_principal_id }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      VALID_DAYS: ${{ inputs.valid_days }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with service principal secret
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r entra-id/requirements.txt

      - name: Add password for testing
        run: |
          set -euo pipefail
          trap 'rm -f credential.json' EXIT

          python entra-id/add_sp_password.py \
            --display-name "$DISPLAY_NAME" \
            --valid-days "$VALID_DAYS" \
            > credential.json

          SECRET_TEXT="$(jq -r '.secretText' credential.json)"
          KEY_ID="$(jq -r '.keyId' credential.json)"

          if [[ -z "$SECRET_TEXT" || "$SECRET_TEXT" == "null" ]]; then
            echo "The script did not return a secretText value." >&2
            exit 1
          fi

          echo "::add-mask::$SECRET_TEXT"
          echo "Created password credential with keyId: $KEY_ID"
          echo "Store this keyId for the remove_sp_password.py workflow: $KEY_ID"
          echo "The generated secret is masked and will be deleted with the temporary runner file."