name: Remove service principal password

on:
  workflow_dispatch:
    inputs:
      service_principal_id:
        description: Enterprise application service principal object ID, not App registration object ID
        required: true
        type: string
      key_id:
        description: Key ID of the password credential to remove
        required: true
        type: string

permissions:
  contents: read

jobs:
  remove-password:
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      AZURE_SERVICE_PRINCIPAL_ID: ${{ inputs.service_principal_id }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      KEY_ID: ${{ inputs.key_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with service principal secret
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r entra-id/requirements.txt

      - name: Remove and verify password
        run: python entra-id/remove_sp_password.py --key-id "$KEY_ID"